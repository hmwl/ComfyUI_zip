[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui_zip"
description = "ComfyUI zip package image processing"
version = "1.0.0"
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/hmwl/ComfyUI_zip"
# Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "hmwl"
DisplayName = "ComfyUI Zip"
Icon = ""

[tool.setuptools]
packages = ["ComfyUI_zip"] 
